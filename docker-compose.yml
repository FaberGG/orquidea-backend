# Uso:
#   docker compose up -d                  -> db, pgadmin y storage (para correr la API desde el IDE)
#   docker compose --profile app up -d    -> también la API en contenedor
# Requiere un archivo .env (copiar .env.example).

services:
  api:
    build: .
    image: orquidea-backend:latest
    container_name: orquidea-api
    profiles: ["app"]
    ports:
      - "${PUERTO_API:-8080}:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:?Falta .env, copie .env.example a .env}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRETO=${JWT_SECRETO}
      - JWT_EXPIRACION=${JWT_EXPIRACION:-8h}
      - SUPERADMIN_NOMBRE=${SUPERADMIN_NOMBRE:-Super}
      - SUPERADMIN_APELLIDO=${SUPERADMIN_APELLIDO:-Administrador}
      - SUPERADMIN_CORREO=${SUPERADMIN_CORREO}
      - SUPERADMIN_CONTRASENA=${SUPERADMIN_CONTRASENA}
      - ADMINISTRADORES_LIMITE=${ADMINISTRADORES_LIMITE:-3}
      # Dentro de la red de Docker la API habla con "storage"; el navegador sigue usando localhost
      - STORAGE_ENDPOINT=http://storage:9000
      - STORAGE_REGION=${STORAGE_REGION:-us-east-1}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-orquidea}
      - STORAGE_URL_PUBLICA=${STORAGE_URL_PUBLICA}
      - STORAGE_CREAR_BUCKET=${STORAGE_CREAR_BUCKET:-true}
      - MAIL_HOST=${MAIL_HOST:-localhost}
      - MAIL_PUERTO=${MAIL_PUERTO:-25}
      - MAIL_USUARIO=${MAIL_USUARIO:-}
      - MAIL_CONTRASENA=${MAIL_CONTRASENA:-}
      - MAIL_REMITENTE=${MAIL_REMITENTE:-}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    networks:
      - orquidea-network

  db:
    image: postgres:alpine
    container_name: orquidea-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?Falta .env, copie .env.example a .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PUERTO:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - orquidea-network

  # Almacenamiento S3 local (reemplaza a Cloudflare R2 en desarrollo). Consola web en el puerto 9001.
  storage:
    image: rustfs/rustfs:1.0.0
    container_name: orquidea-storage
    environment:
      - RUSTFS_ACCESS_KEY=${STORAGE_ACCESS_KEY:?Falta STORAGE_ACCESS_KEY en .env, copie .env.example}
      - RUSTFS_SECRET_KEY=${STORAGE_SECRET_KEY}
    volumes:
      - storage_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - orquidea-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: orquidea-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_CORREO:?Falta PGADMIN_CORREO en .env, copie .env.example}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_CONTRASENA:?Falta PGADMIN_CONTRASENA en .env, copie .env.example}
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - orquidea-network
  
  mailpit:
    image: axllent/mailpit:latest
    container_name: orquidea-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - orquidea-network

volumes:
  db_data:
  storage_data:
  pgadmin_data:

networks:
  orquidea-network:
    driver: bridge
