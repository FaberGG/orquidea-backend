# Uso:
#   docker compose up -d                  -> solo db y pgadmin (para correr la API desde el IDE)
#   docker compose --profile app up -d    -> también la API en contenedor
# Requiere un archivo .env (copiar .env.example).

services:
  api:
    build: .
    image: orquidea-backend:latest
    container_name: orquidea-api
    profiles: ["app"]
    ports:
      - "${PUERTO_API:-8080}:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:?Falta .env, copie .env.example a .env}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRETO=${JWT_SECRETO}
      - JWT_EXPIRACION=${JWT_EXPIRACION:-8h}
      - SUPERADMIN_NOMBRE=${SUPERADMIN_NOMBRE:-Superadministrador}
      - SUPERADMIN_CORREO=${SUPERADMIN_CORREO}
      - SUPERADMIN_CONTRASENA=${SUPERADMIN_CONTRASENA}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - orquidea-network

  db:
    image: postgres:alpine
    container_name: orquidea-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?Falta .env, copie .env.example a .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PUERTO:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - orquidea-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: orquidea-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_CORREO:-admin@orquidea.local}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_CONTRASENA:-admin}
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - orquidea-network

volumes:
  db_data:
  pgadmin_data:

networks:
  orquidea-network:
    driver: bridge
