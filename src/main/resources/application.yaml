spring:
  application:
    name: orquidea-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/orquidea_db
    username: orquidea_user
    password: orquidea_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
